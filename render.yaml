# Render Blueprint for the Docker deployment.
# The app refuses to boot on public PaaS hosts unless an access gate is configured.
# BASIC_AUTH_PASS is generated by Render so no production secret is committed to git.
services:
  - type: web
    name: explorer-by-sl-leads
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: BASIC_AUTH_USER
        value: admin
      - key: BASIC_AUTH_PASS
        generateValue: true
      - key: LEADLENS_CORS_ORIGINS
        value: ""
      - key: LEADLENS_DATA_DIR
        value: /data
    disk:
      name: leadlens-data
      mountPath: /data
      sizeGB: 1
